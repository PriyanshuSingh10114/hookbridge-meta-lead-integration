<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HookBridge - Lead Test Form</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #f8fafc; }
    p.desc { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.4; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 10px 14px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; font-size: 14px; }
    input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    button { width: 100%; background: #2563eb; color: #ffffff; font-weight: 600; font-size: 14px; padding: 12px; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; transition: background 0.15s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px; text-align: center; display: none; }
    .status.success { display: block; background: #064e3b; color: #a7f3d0; border: 1px solid #059669; }
    .status.error { display: block; background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lead Submission Form</h1>
    <p class="desc">Enter contact details below to trigger a real-time lead event to your open React Native screen.</p>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" value="Sarah Connor" placeholder="Enter full name" />
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" value="sarah@sky-res.org" placeholder="Enter email address" />
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="text" id="phone" value="+1-555-888-9999" placeholder="Enter phone number" />
    </div>

    <button id="submitBtn" onclick="submitLead()">Submit Lead</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    async function submitLead() {
      const btn = document.getElementById('submitBtn');
      const status = document.getElementById('status');
      const name = document.getElementById('name').value.trim() || 'Jane Doe';
      const email = document.getElementById('email').value.trim() || 'jane@example.com';
      const phone = document.getElementById('phone').value.trim() || '+1-555-0100';

      btn.disabled = true;
      btn.innerText = 'Submitting...';
      status.className = 'status';

      try {
        const res = await fetch('/api/leads/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, phone })
        });

        const data = await res.json();
        if (res.ok) {
          status.className = 'status success';
          status.innerText = 'Lead sent successfully! Check your dashboard.';
        } else {
          status.className = 'status error';
          status.innerText = data.error || 'Failed to submit lead.';
        }
      } catch (err) {
        status.className = 'status error';
        status.innerText = 'Server unreachable: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit Another Lead';
      }
    }
  </script>
</body>
</html>
